<aside class="post-toc" data-post-toc hidden>
  <div class="post-toc-panel">
    <button
      class="post-toc-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="post-toc-list"
    >
      <span>ON THIS PAGE / 目录</span>
      <span class="post-toc-toggle-icon" aria-hidden="true">+</span>
    </button>
    <nav id="post-toc-list" class="post-toc-nav" aria-label="文章目录">
      <ol class="post-toc-list" data-post-toc-list></ol>
    </nav>
  </div>
</aside>
