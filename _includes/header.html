{% assign blog_active = false %}
{% if page.url contains '/blog/' or page.layout == 'post' %}
  {% assign blog_active = true %}
{% endif %}

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 首页">
      <span class="brand-mark" aria-hidden="true">M/</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>

    <nav class="site-nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
      <a href="{{ '/blog/' | relative_url }}"{% if blog_active %} aria-current="page"{% endif %}>Blog</a>
      <a class="nav-icon-link" href="https://github.com/MiyaaL" target="_blank" rel="me noopener" aria-label="在新窗口打开 MiyaaL 的 GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.28-1.29-5.28-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.59.23 2.77.12 3.06.74.81 1.18 1.84 1.18 3.1 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
        </svg>
      </a>
      <button class="theme-toggle" type="button" aria-label="切换颜色主题" title="主题：跟随系统">
        <svg class="theme-icon theme-system" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="13" rx="2"></rect>
          <path d="M8 21h8M12 17v4"></path>
        </svg>
        <svg class="theme-icon theme-light" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
        </svg>
        <svg class="theme-icon theme-dark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.3 15.6A9 9 0 0 1 8.4 3.7a9 9 0 1 0 11.9 11.9Z"></path>
        </svg>
      </button>
    </nav>
  </div>
</header>
