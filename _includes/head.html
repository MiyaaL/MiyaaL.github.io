<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b13">
{% seo %}
<link rel="alternate" type="application/atom+xml" title="{{ site.title }} Feed" href="{{ '/feed.xml' | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/icons/favicon.svg' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/css/course.css' | relative_url }}">
{% if page.layout == "post" %}
<link rel="stylesheet" href="{{ '/assets/css/post-toc.css' | relative_url }}">
{% endif %}

<script>
  (function () {
    var root = document.documentElement;
    var themeColor = document.querySelector('meta[name="theme-color"]');
    root.classList.add("js");
    try {
      var storedMode = localStorage.getItem("theme-mode");
      var mode = ["system", "light", "dark"].indexOf(storedMode) >= 0 ? storedMode : "dark";
      var theme = mode === "system"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : mode;
      root.dataset.themeMode = mode;
      root.dataset.theme = theme;
      themeColor.setAttribute("content", theme === "dark" ? "#070b13" : "#f4f6f9");
    } catch (_) {
      root.dataset.themeMode = "dark";
      root.dataset.theme = "dark";
    }
  }());
</script>

{% if page.math %}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["$", "$"], ["\\(", "\\)"]],
      displayMath: [["$$", "$$"], ["\\[", "\\]"]],
      processEscapes: true,
      processRefs: true,
      tags: "ams",
      tagSide: "right",
      tagIndent: "0.8em",
      useLabelIds: true
    },
    options: {
      skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
{% endif %}

{% if page.mermaid %}
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script defer src="{{ '/assets/js/mermaid-init.js' | relative_url }}"></script>
{% endif %}
