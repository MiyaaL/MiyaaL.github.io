---
layout: default
title: Tips
description: "按数学、机器学习算法与 Infra/芯片整理的轻量知识说明文档。"
permalink: /tips/
tips: true
---
<section class="tips-hero">
  <div class="container tips-hero-inner">
    <div>
      <p class="eyebrow">LEARNING NOTES</p>
      <h1>Tips</h1>
      <p class="tips-intro">记录知识点的短解释与说明文档，按数学、机器学习算法和 Infra / 芯片长期整理。</p>
    </div>
    <div class="tips-hero-actions">
      <span class="tips-sync-state" data-tips-sync-state>Loading</span>
      <button class="tips-button tips-button-primary" type="button" data-tips-auth>Manage Tips</button>
    </div>
  </div>
</section>

<section class="tips-section">
  <div
    class="container tips-app"
    data-tips-app
    data-catalog-url="{{ '/assets/tips/catalog.json' | relative_url }}"
    data-supabase-url="{{ site.plan.supabase_url | default: '' | escape }}"
    data-supabase-key="{{ site.plan.supabase_publishable_key | default: '' | escape }}"
    data-repository="{{ site.repository | escape }}"
    data-branch="main"
  >
    <div class="tips-message" data-tips-message role="status" aria-live="polite"></div>

    <nav class="tips-categories" data-tips-categories aria-label="Tips categories"></nav>

    <header class="tips-toolbar">
      <label class="tips-search">
        <span class="sr-only">Search Tips</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m16.5 16.5 4 4"></path>
        </svg>
        <input type="search" data-tips-search placeholder="搜索标题、说明或标签…" autocomplete="off">
      </label>
      <button class="tips-text-button" type="button" data-tips-upload hidden>新增 Tip</button>
    </header>

    <p class="tips-count" data-tips-count></p>

    <div class="tips-workspace" data-tips-workspace>
      <section class="tips-results" aria-label="Tips documents">
        <div class="tips-groups" data-tips-groups></div>
      </section>

      <section class="tips-reader" data-tips-reader aria-labelledby="tips-reader-title" hidden>
        <header class="tips-reader-header">
          <div>
            <p class="eyebrow" data-tips-reader-category></p>
            <h2 id="tips-reader-title" data-tips-reader-title></h2>
            <p data-tips-reader-description></p>
          </div>
          <div class="tips-reader-actions">
            <a class="tips-text-button" data-tips-open-source target="_blank" rel="noopener">查看原文件</a>
            <button class="tips-icon-button" type="button" data-tips-close-reader aria-label="关闭阅读器">×</button>
          </div>
        </header>
        <div class="tips-reader-stage">
          <div class="tips-reader-loading" data-tips-reader-loading>
            <span aria-hidden="true"></span>
            <p>正在加载文档…</p>
          </div>
          <p class="tips-reader-error" data-tips-reader-error hidden></p>
          <iframe
            class="tips-reader-frame"
            data-tips-reader-frame
            title="Tip document"
            sandbox="allow-popups allow-popups-to-escape-sandbox"
            referrerpolicy="no-referrer"
          ></iframe>
        </div>
      </section>
    </div>

    <dialog class="tips-upload-dialog" data-tips-upload-dialog>
      <form method="dialog" class="tips-upload-form" data-tips-upload-form>
        <header>
          <div>
            <p class="eyebrow">NEW EXPLANATION</p>
            <h2>新增 Tip</h2>
          </div>
          <button class="tips-icon-button" type="button" data-tips-close-upload aria-label="关闭上传窗口">×</button>
        </header>

        <fieldset class="tips-source-picker">
          <legend>内容来源</legend>
          <label>
            <input type="radio" name="source" value="file" checked>
            <span>Markdown / HTML</span>
            <small>文件存入 GitHub Release，不写入 Git 历史。</small>
          </label>
          <label>
            <input type="radio" name="source" value="external">
            <span>网页链接</span>
            <small>目录只保存公开 HTTPS 地址。</small>
          </label>
        </fieldset>

        <p class="tips-upload-note" data-tips-source-note>文件会作为 GitHub Release Asset 保存；主分支只提交轻量目录元数据。</p>

        <label data-tips-file-field>
          <span>说明文档</span>
          <input type="file" accept="text/markdown,text/html,.md,.markdown,.html,.htm" name="document" required data-tips-file>
          <small>Markdown 或 HTML · 最大 2 MB · UTF-8</small>
        </label>

        <label data-tips-url-field hidden>
          <span>公开网页地址</span>
          <input type="url" name="url" inputmode="url" placeholder="https://example.org/explanation" data-tips-url>
        </label>

        <label>
          <span>标题</span>
          <input type="text" name="title" maxlength="160" required placeholder="这个知识点是什么？">
        </label>

        <label>
          <span>分类</span>
          <select name="category" required>
            <option value="mathematics">数学</option>
            <option value="machine-learning">机器学习算法</option>
            <option value="infra-chip">Infra / 芯片</option>
          </select>
        </label>

        <label>
          <span>一句话说明</span>
          <textarea name="description" maxlength="240" rows="3" required placeholder="说明这份 Tip 解释了什么。"></textarea>
        </label>

        <label>
          <span>标签</span>
          <input type="text" name="tags" maxlength="240" placeholder="Linear Algebra, CUDA, Transformer">
          <small>使用英文逗号分隔，最多 8 个。</small>
        </label>

        <label class="tips-upload-consent">
          <input type="checkbox" name="consent" required>
          <span>我确认该内容可以公开展示，且其中不包含密钥或其他敏感信息。</span>
        </label>

        <p class="tips-form-error" data-tips-upload-error role="alert"></p>
        <div class="tips-upload-actions">
          <button class="tips-button" type="button" data-tips-cancel-upload>取消</button>
          <button class="tips-button tips-button-primary" type="submit" data-tips-submit-upload>发布到 GitHub</button>
        </div>
      </form>
    </dialog>
  </div>
</section>
