title: MiyaaL
tagline: AI Infra
description: Research on LLM and VLA infrastructure, performance modeling, and systems optimization.
url: https://miyaal.github.io
baseurl: ""
repository: MiyaaL/MiyaaL.github.io
theme: null

lang: en
timezone: Asia/Shanghai
permalink: /blog/:year/:month/:day/:title/

author:
  name: MiyaaL
  url: https://github.com/MiyaaL

logo: /assets/icons/og-card.png

social:
  name: MiyaaL
  links:
    - https://github.com/MiyaaL

plan:
  supabase_url: "https://buawzvkuirytticsxigm.supabase.co"
  supabase_publishable_key: "sb_publishable_OtL6z18NHoU5zoalRMPJ1A_ZdKLdx24"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

excerpt_separator: <!--more-->
strict_front_matter: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: MiyaaL
      math: false
      mermaid: false
      lang: zh-CN
  - scope:
      path: ""
    values:
      image: /assets/icons/og-card.png

exclude:
  - AGENTS.md
  - compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CONTENT-LICENSE.md
  - README.md
  - scripts
  - supabase
  - tests
  - docs
  - vendor
  - .bundle-cache
  - node_modules
  - package.json
  - package-lock.json
