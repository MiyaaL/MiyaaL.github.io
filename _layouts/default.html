<!doctype html>
<html lang="{{ page.lang | default: site.lang }}" data-theme="dark" data-theme-mode="dark">
  <head>
    {% include head.html %}
  </head>
  <body class="layout-{{ page.layout | default: 'default' }}">
    <canvas class="space-background" data-starfield aria-hidden="true"></canvas>
    <div class="moon" aria-hidden="true">
      <span class="moon-crescent"></span>
    </div>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    {% include header.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/starfield.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  </body>
</html>
